<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Privacy Awareness System</title>
  <meta name="description" content="Create your account on the Privacy Awareness and Security Management System">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🛡️</div>
      <h1>Create Account</h1>
      <p>Join the Privacy Awareness Platform</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name <span class="text-dim">(optional)</span></label>
        <input id="fullName" class="form-input" type="text" placeholder="Your full name" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username *</label>
        <input id="username" class="form-input" type="text" placeholder="3–50 characters, letters/digits/underscore" autocomplete="username" required>
        <div id="username-error" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input id="email" class="form-input" type="email" placeholder="you@example.com" autocomplete="email" required>
        <div id="email-error" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password *</label>
        <input id="password" class="form-input" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        <div class="form-hint">Must include uppercase, lowercase, digit, and special character (@$!%*?&_#)</div>
        <div id="password-error" class="form-error"></div>
      </div>

      <button id="register-btn" class="btn btn-primary btn-full btn-lg" type="submit">Create Account</button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-sm text-muted" style="text-align:center">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  const user = await getCurrentUser();
  if (user) { window.location.href = '/dashboard.html'; return; }

  const form    = document.getElementById('register-form');
  const btn     = document.getElementById('register-btn');
  const alertEl = document.getElementById('alert');

  function validate() {
    let ok = true;
    const username = document.getElementById('username').value.trim();
    const uErr = document.getElementById('username-error');
    if (!/^[a-zA-Z0-9_]{3,50}$/.test(username)) {
      uErr.textContent = 'Username must be 3–50 characters (letters, digits, underscore)';
      uErr.classList.add('visible'); ok = false;
    } else { uErr.classList.remove('visible'); }

    const email = document.getElementById('email').value.trim();
    const eErr = document.getElementById('email-error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      eErr.textContent = 'Enter a valid email address'; eErr.classList.add('visible'); ok = false;
    } else { eErr.classList.remove('visible'); }

    const pw = document.getElementById('password').value;
    const pErr = document.getElementById('password-error');
    if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&_#])[A-Za-z\d@$!%*?&_#]{8,}$/.test(pw)) {
      pErr.textContent = 'Password does not meet requirements'; pErr.classList.add('visible'); ok = false;
    } else { pErr.classList.remove('visible'); }
    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validate()) return;
    setLoading(btn, true);
    try {
      await API.post('/api/auth/register', {
        username: document.getElementById('username').value.trim(),
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        fullName: document.getElementById('fullName').value.trim() || null
      });
      showAlert(alertEl, '✅ Account created successfully! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/login.html', 1500);
    } catch (err) {
      const details = err.data?.details;
      if (details) {
        Object.entries(details).forEach(([field, msg]) => {
          const errEl = document.getElementById(`${field}-error`);
          if (errEl) { errEl.textContent = msg; errEl.classList.add('visible'); }
        });
      }
      showAlert(alertEl, err.message || 'Registration failed.', 'error');
    } finally {
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
