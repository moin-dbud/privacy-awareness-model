<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Privacy Awareness System</title>
  <meta name="description" content="Sign in to the Social Media Privacy Awareness and Security Management System">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🛡️</div>
      <h1>Privacy Guard</h1>
      <p>Social Media Security Management System</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" class="form-input" type="text" placeholder="Enter your username" autocomplete="username" required>
        <div id="username-error" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" class="form-input" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <div id="password-error" class="form-error"></div>
      </div>

      <button id="login-btn" class="btn btn-primary btn-full btn-lg" type="submit">Sign In</button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-sm text-muted" style="text-align:center">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>

    <div class="alert alert-info mt-16" style="font-size:0.8rem">
      <span>💡</span>
      <span>This is an educational prototype. Do not enter real social media credentials.</span>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  // If already logged in, redirect
  const user = await getCurrentUser();
  if (user) {
    window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
    return;
  }

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('login-btn');
  const alertEl = document.getElementById('alert');

  function validateField(id, errorId, condition, msg) {
    const val = document.getElementById(id).value.trim();
    const err = document.getElementById(errorId);
    if (!condition(val)) { err.textContent = msg; err.classList.add('visible'); return false; }
    err.classList.remove('visible'); return true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let valid = true;
    valid &= validateField('username', 'username-error', v => v.length >= 1, 'Username is required');
    valid &= validateField('password', 'password-error', v => v.length >= 1, 'Password is required');
    if (!valid) return;

    setLoading(btn, true);
    try {
      const user = await API.post('/api/auth/login', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      });
      window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
    } catch (err) {
      showAlert(alertEl, err.message || 'Login failed. Please try again.', 'error');
    } finally {
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
